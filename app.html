<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Исполнительская дисциплина</title>
<style>
:root{
  --bg:#f3f5f9;--surface:#fff;--s2:#eef2f8;--text:#16212f;--muted:#5b6b80;--line:#dbe2ec;
  --navy:#16335c;--steel:#3d6aa5;--accent:#2a5ea8;
  --ok:#1f8a4c;--warn:#b57a05;--bad:#c23a3a;--info:#3d6aa5;
  --okb:#e3f4ea;--warnb:#fbf0d6;--badb:#f9e2e2;--infob:#e4edf8;
  --sh:0 1px 2px rgba(22,51,92,.06),0 4px 14px rgba(22,51,92,.06);
}
:root[data-theme=dark]{
  --bg:#0e141d;--surface:#161f2c;--s2:#1c2736;--text:#e6ecf4;--muted:#93a3b8;--line:#2a3748;
  --navy:#0f2342;--steel:#6f9bd6;--accent:#7ea8e0;
  --ok:#4cc27f;--warn:#e5b23f;--bad:#ef7676;--info:#7ea8e0;
  --okb:#16301f;--warnb:#352a10;--badb:#3a1a1a;--infob:#182a42;--sh:none;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e141d;--surface:#161f2c;--s2:#1c2736;--text:#e6ecf4;--muted:#93a3b8;--line:#2a3748;
  --navy:#0f2342;--steel:#6f9bd6;--accent:#7ea8e0;
  --ok:#4cc27f;--warn:#e5b23f;--bad:#ef7676;--info:#7ea8e0;
  --okb:#16301f;--warnb:#352a10;--badb:#3a1a1a;--infob:#182a42;--sh:none}}
*{box-sizing:border-box}
html{color-scheme:light dark}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
h1,h2,h3{margin:0}
.hdr{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:env(safe-area-inset-top) 0 0}
.hdr .in{max-width:1080px;margin:0 auto;padding:0 12px;height:54px;display:flex;align-items:center;gap:8px}
.hdr .un{font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;min-width:44px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.ib:hover{background:rgba(255,255,255,.2)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;border-radius:99px;min-width:20px;height:20px;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.who{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;padding:6px 2px;min-height:56px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px}
.nav button .i{font-size:20px;line-height:1}
.nav button[aria-current=page]{color:var(--accent);font-weight:600}
main{max-width:1080px;margin:0 auto;padding:14px 12px calc(86px + env(safe-area-inset-bottom))}
@media(min-width:860px){
  .nav{position:sticky;top:calc(54px + env(safe-area-inset-top));bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;padding:0}
  .nav button{flex:none;flex-direction:row;gap:8px;padding:0 18px;font-size:14px;min-height:48px}
  .nav button[aria-current=page]{box-shadow:inset 0 -3px 0 var(--accent)}
  main{padding-bottom:40px}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--sh);margin-bottom:12px}
.pt{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pt h2{font-size:21px;flex:1;min-width:140px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--infob);color:var(--info);white-space:nowrap}
.tag.ok{background:var(--okb);color:var(--ok)}.tag.warn{background:var(--warnb);color:var(--warn)}.tag.bad{background:var(--badb);color:var(--bad)}.tag.mut{background:var(--s2);color:var(--muted)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:42px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--s2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{filter:brightness(1.15);background:var(--navy)}
.btn.dng{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:40px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],input[type=date],input[type=password],input[type=tel],input[type=email],select,textarea{width:100%;min-height:42px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;margin-bottom:10px;font-size:13px;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{margin-top:4px;color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;min-height:40px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.task{border-left:6px solid var(--steel);padding-left:12px}
.task.high{border-left-color:var(--bad)}.task.mid{border-left-color:var(--warn)}.task.low{border-left-color:var(--steel)}
.task.done{opacity:.85}
.task h3{font-size:16px;margin-right:6px}
.task .meta{color:var(--muted);font-size:13px;margin:4px 0}
.task .desc{margin:6px 0;white-space:pre-wrap}
.steps label{display:flex;gap:10px;align-items:flex-start;padding:6px 0;min-height:36px;cursor:pointer}
.steps input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--ok)}
.steps input:checked+span{text-decoration:line-through;color:var(--muted)}
.prog{height:8px;border-radius:4px;background:var(--s2);overflow:hidden;margin:6px 0}
.prog i{display:block;height:100%;background:var(--ok)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.acts select{width:auto}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.kpi b{display:block;font-size:26px;line-height:1.2}
.kpi span{font-size:12px;color:var(--muted)}
.seg{display:flex;height:16px;border-radius:8px;overflow:hidden;background:var(--s2);margin:4px 0}
.seg i{display:block;height:100%}
.c-ok{background:var(--ok)}.c-late{background:var(--warn)}.c-bad{background:var(--bad)}.c-act{background:var(--steel)}
.leg{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.brow{margin:12px 0}
.brow .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.brow .nums{font-size:12px;color:var(--muted)}
.trend{display:flex;gap:8px;align-items:flex-end;height:140px;padding-top:10px}
.trend .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--muted)}
.trend .bar{width:100%;max-width:46px;background:var(--steel);border-radius:6px 6px 0 0;min-height:3px}
table{width:100%;border-collapse:collapse}
.tw{overflow-x:auto}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.person{display:flex;gap:12px;align-items:flex-start}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:600}
.person .nm{font-weight:600}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.alert:last-child{border:0}
.alert .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.cl{display:flex;gap:10px;align-items:center;padding:4px 0;min-height:44px}
.cl input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok);flex:none}
.cl input[type=checkbox]:checked+span{text-decoration:line-through;color:var(--muted)}
.cl span{flex:1}
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 20px));max-height:calc(100vh - 20px);background:var(--surface);color:var(--text);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,12,25,.55)}
dialog .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
dialog .dh h3{flex:1}
dialog .db{padding:14px 16px}
dialog .df{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
.toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));right:10px;left:10px;z-index:100;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.3);border-left:5px solid var(--steel)}
.toast.bad{border-left-color:var(--bad)}.toast.ok{border-left-color:var(--ok)}.toast.warn{border-left-color:var(--warn)}
.login{max-width:520px;margin:0 auto;padding:30px 14px}
.login h1{font-size:26px;color:var(--navy);margin-bottom:6px}
:root[data-theme=dark] .login h1{color:var(--text)}
.pick{display:flex;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;min-height:56px;align-items:center}
.pick:hover{background:var(--s2)}
.muted{color:var(--muted)}.small{font-size:13px}
.sec h3{font-size:16px;margin-bottom:8px}
.sec .hint{font-size:13px;color:var(--muted);margin:2px 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:5px 0;cursor:pointer}
.opt input{width:20px;height:20px;margin-top:1px;flex:none}
@media print{.hdr,.nav,.acts,.toasts{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
'use strict';
/* ===== утилиты ===== */
const KEY='ispdisc.v1',MEKEY='ispdisc.me',DEVKEY='ispdisc.dev',THKEY='ispdisc.theme';
const MAXSTAFF=15,W={high:3,mid:2,low:1};
const PRN={high:'Высокая',mid:'Средняя',low:'Низкая'},STN={new:'Новое',progress:'В работе',done:'Выполнено'},RLN={head:'Руководитель',deputy:'Заместитель',staff:'Сотрудник'};
const mem={};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return mem[k]??null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){mem[k]=v;return false}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const dn=s=>{const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const diff=(a,b)=>dn(a)-dn(b);
const addDays=(s,n)=>{const t=new Date((dn(s)+n)*864e5);return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate())};
const fmt=s=>s?s.split('-').reverse().join('.'):'';
const plural=(n,a,b,c)=>{n=Math.abs(n);const m=n%100,k=n%10;return m>10&&m<20?c:k===1?a:k>=2&&k<=4?b:c};
const days=n=>n+' '+plural(n,'день','дня','дней');
const initials=n=>(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const $=s=>document.querySelector(s);

/* ===== данные ===== */
let db=load(),me=lsGet(MEKEY),timer=null,seen=new Set();
const ui={tab:'tasks',f:{st:'active',pr:'',as:'',q:''},period:30,cq:''};
function emptyDb(){return{staff:[],tasks:[],config:{unit:'Структурное подразделение',remind:[3,1,0],joinCode:''},checklists:{}}}
function load(){try{const d=JSON.parse(lsGet(KEY));if(d&&d.staff&&d.tasks){d.config=Object.assign(emptyDb().config,d.config);d.checklists=d.checklists||{};return d}}catch(e){}return emptyDb()}
function save(){if(!lsSet(KEY,JSON.stringify(db)))toast('Не удалось сохранить данные в браузере — изменения могут пропасть','bad')}
const dev=()=>{let d=lsGet(DEVKEY);if(!d){d=uid();lsSet(DEVKEY,d)}return d};
const staffBy=id=>db.staff.find(s=>s.id===id);
const meS=()=>staffBy(me);
const isMgr=()=>{const s=meS();return !!s&&(s.role==='head'||s.role==='deputy')};
const isHead=()=>meS()?.role==='head';
const visTasks=()=>isMgr()?db.tasks:db.tasks.filter(t=>t.assignee===me);

/* ===== расчёты ===== */
function tstate(t){
  if(t.status==='done')return diff(t.doneAt||t.due,t.due)<=0?'ontime':'late';
  const d=diff(t.due,today());return d<0?'overdue':d===0?'today':'active';
}
function score(list){let g=0,m=0;list.forEach(t=>{const s=tstate(t),w=W[t.priority]||1;
  if(s==='ontime'){g+=w;m+=w}else if(s==='late'){g+=w/2;m+=w}else if(s==='overdue'){m+=w}});
  return m?g/m:null}
const level=p=>p==null?['—','mut']:p>=.9?['Высокая','ok']:p>=.75?['Хорошая','']:p>=.5?['Требует внимания','warn']:['Низкая','bad'];
const pc=p=>p==null?'—':Math.round(p*100)+'%';
function inPeriod(list,p){if(p==='all')return list;const from=addDays(today(),-p);return list.filter(t=>t.due>=from)}
function dueLabel(t){
  const s=tstate(t);
  if(s==='ontime')return['Выполнено в срок','ok'];
  if(s==='late')return['Выполнено с опозданием на '+days(diff(t.doneAt,t.due)),'warn'];
  const d=diff(t.due,today());
  if(d<0)return['Просрочено на '+days(-d),'bad'];
  if(d===0)return['Срок сегодня','warn'];
  if(d===1)return['Завтра','warn'];
  return['Через '+days(d),''];
}
function sortTasks(a){
  const act=a.filter(t=>t.status!=='done').sort((x,y)=>x.due.localeCompare(y.due)||W[y.priority]-W[x.priority]);
  const dn_=a.filter(t=>t.status==='done').sort((x,y)=>(y.doneAt||'').localeCompare(x.doneAt||''));
  return act.concat(dn_);
}

/* ===== оповещения ===== */
function events(){
  const T=today(),out=[];
  const mine=db.tasks.filter(t=>t.assignee===me&&t.nudge&&!t.nudge.ack&&t.status!=='done');
  mine.forEach(t=>out.push({key:'n'+t.id+t.nudge.at,kind:'nudge',t,text:'Напоминание от '+(staffBy(t.nudge.by)?.name||'руководителя')}));
  visTasks().filter(t=>t.status!=='done').forEach(t=>{
    const d=diff(t.due,T);
    if(d<0)out.push({key:'o'+t.id+T,kind:'overdue',t,text:'Просрочено на '+days(-d)});
    else if(db.config.remind.includes(d))out.push({key:'s'+t.id+T+d,kind:'soon',t,text:d===0?'Срок сегодня':'Срок через '+days(d)});
  });
  const rank={nudge:0,overdue:1,soon:2};
  return out.sort((a,b)=>rank[a.kind]-rank[b.kind]);
}
function summary(){
  const e=events(),c=k=>e.filter(x=>x.kind===k).length;
  if(!e.length)return;
  toast('Просрочено: '+c('overdue')+' · Скоро срок: '+c('soon')+' · Напоминаний: '+c('nudge'),c('overdue')?'bad':'warn');
  e.forEach(x=>seen.add(x.key));
}
function tick(){
  if(!me||!meS())return;
  events().forEach(x=>{if(seen.has(x.key))return;seen.add(x.key);
    const msg=x.t.title+' — '+x.text;toast(msg,x.kind==='overdue'?'bad':'warn');
    try{if('Notification' in window&&Notification.permission==='granted')new Notification('Исполнительская дисциплина',{body:msg})}catch(e){}});
  const b=$('#bellB');const n=events().length;if(b){b.textContent=n;b.hidden=!n}
}
function startTimer(){clearInterval(timer);timer=setInterval(tick,60000)}

/* ===== UI-хелперы ===== */
function toast(msg,type=''){
  const d=document.createElement('div');d.className='toast '+type;d.textContent=msg;$('#toasts').appendChild(d);
  setTimeout(()=>d.remove(),6000);
}
function openDlg(title,body){
  const d=$('#dlg');
  d.innerHTML='<div class="dh"><h3>'+esc(title)+'</h3><button class="btn sm" data-act="closeDlg" aria-label="Закрыть">✕</button></div><div class="db">'+body+'</div>';
  if(!d.open)d.showModal();
}
function closeDlg(){const d=$('#dlg');if(d.open)d.close()}
const THEME=()=>{const t=lsGet(THKEY);if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')};

/* ===== отрисовка ===== */
function R(){
  const app=$('#app');
  if(!me||!meS()){me=null;app.innerHTML=loginView();return}
  const s=meS(),n=events().length;
  const tabs=[['tasks','📋','Поручения'],['analytics','📊','Аналитика'],['rating','🏆','Рейтинг'],['checklist','✅','Чек-лист'],['contacts','📇','Контакты'],['settings','⚙️','Ещё']];
  app.innerHTML=
   '<header class="hdr"><div class="in"><span class="un">'+esc(db.config.unit)+'</span>'+
   '<button class="ib" data-act="tab" data-t="alerts" aria-label="Оповещения">🔔<span class="badge" id="bellB"'+(n?'':' hidden')+'>'+n+'</span></button>'+
   '<button class="ib" data-act="tab" data-t="settings" aria-label="Профиль"><span class="who">'+esc(s.name)+'</span></button></div></header>'+
   '<nav class="nav" aria-label="Разделы">'+tabs.map(t=>'<button data-act="tab" data-t="'+t[0]+'"'+(ui.tab===t[0]?' aria-current="page"':'')+'><span class="i" aria-hidden="true">'+t[1]+'</span>'+t[2]+'</button>').join('')+'</nav>'+
   '<main id="view">'+(views[ui.tab]||views.tasks)()+'</main>';
}
const views={tasks:tasksView,analytics:analyticsView,rating:ratingView,checklist:checklistView,contacts:contactsView,settings:settingsView,alerts:alertsView};

/* --- вход --- */
function loginView(){
  const first=!db.staff.length;
  let h='<div class="login"><h1>Исполнительская дисциплина</h1><p class="muted">'+esc(db.config.unit)+'</p>';
  if(first){
    h+='<div class="card"><h3>Первый запуск</h3><p class="muted small">Первый зарегистрированный пользователь становится руководителем.</p>'+newCardForm()+'</div>'+
       '<button class="btn" data-act="demo">Загрузить демонстрационные данные</button>';
  }else{
    h+='<div class="card"><h3 style="margin-bottom:10px">Выберите свою карточку</h3>'+
      db.staff.map(s=>'<button class="pick" data-act="pick" data-id="'+s.id+'"><span class="av">'+esc(initials(s.name))+'</span><span><b>'+esc(s.name)+'</b><br><span class="muted small">'+esc(s.pos||'')+' · '+RLN[s.role]+((s.role!=='staff'&&db.config.joinCode)?' 🔒':'')+'</span></span></button>').join('')+'</div>';
    h+=db.staff.length<MAXSTAFF?'<div class="card"><h3>Новая карточка</h3>'+newCardForm()+'</div>':'<p class="muted small">Достигнут лимит '+MAXSTAFF+' сотрудников.</p>';
  }
  return h+'</div>';
}

function taskList(){
  const f=ui.f;
  let a=visTasks().filter(t=>{
    const s=tstate(t);
    if(f.st==='active'&&t.status==='done')return false;
    if(f.st==='overdue'&&s!=='overdue')return false;
    if(f.st==='done'&&t.status!=='done')return false;
    if(f.pr&&t.priority!==f.pr)return false;
    if(f.as&&t.assignee!==f.as)return false;
    if(f.q&&!t.title.toLowerCase().includes(f.q.toLowerCase()))return false;
    return true;
  });
  a=sortTasks(a);
  return a.length?a.map(taskCard).join(''):'<div class="empty card">Поручений нет'+(isMgr()?'. Создайте первое кнопкой выше.':'.')+'</div>';
}
function taskCard(t){

  const mine=t.assignee===me,can=isMgr()||mine,[dl,dc]=dueLabel(t);

  if(t.nudge&&!t.nudge.ack&&t.status!=='done')h+='<span class="tag warn">🔔 Напоминание</span>';
  h+='</div><div class="meta">'+esc(a?.name||'—')+' · срок '+fmt(t.due)+(t.src?' · '+esc(t.src):'')+(by?' · поставил: '+esc(by.name):'')+'</div>';
  if(t.desc)h+='<div class="desc">'+esc(t.desc)+'</div>';
  if(steps.length){
    h+='<div class="steps">'+steps.map((s,i)=>'<label><input type="checkbox" data-in="step" data-id="'+t.id+'" data-i="'+i+'"'+(s.d?' checked':'')+(can?'':' disabled')+'><span>'+esc(s.t)+'</span></label>').join('')+'</div>';
    h+='<div class="prog" role="progressbar" aria-valuenow="'+done+'" aria-valuemax="'+steps.length+'"><i style="width:'+Math.round(done/steps.length*100)+'%"></i></div><div class="small muted">Шагов выполнено: '+done+' из '+steps.length+'</div>';

  if(mine&&t.nudge&&!t.nudge.ack&&t.status!=='done')h+='<button class="btn sm pri" data-act="ack" data-id="'+t.id+'">Принято</button>';

/* --- аналитика --- */
function periodSel(){return'<select data-in="period" aria-label="Период" style="width:auto">'+[[30,'30 дней'],[90,'90 дней'],[365,'Год'],['all','Всё время']].map(p=>'<option value="'+p[0]+'"'+(String(ui.period)===String(p[0])?' selected':'')+'>'+p[1]+'</option>').join('')+'</select>'}
function segBar(list){
  const c={ontime:0,late:0,overdue:0,work:0};list.forEach(t=>{const s=tstate(t);c[s==='today'||s==='active'?'work':s]++});
  const n=list.length||1;
  return'<div class="seg" role="img" aria-label="в срок '+c.ontime+', с опозданием '+c.late+', просрочено '+c.overdue+', в работе '+c.work+'"><i class="c-ok" style="width:'+c.ontime/n*100+'%"></i><i class="c-late" style="width:'+c.late/n*100+'%"></i><i class="c-bad" style="width:'+c.overdue/n*100+'%"></i><i class="c-act" style="width:'+c.work/n*100+'%"></i></div>'+
   '<div class="nums">в срок <b>'+c.ontime+'</b> · с опозданием <b>'+c.late+'</b> · просрочено <b>'+c.overdue+'</b> · в работе <b>'+c.work+'</b></div>';
}
function analyticsView(){
  const all=visTasks(),list=inPeriod(all,ui.period);
  const st=list.map(tstate),cnt=k=>st.filter(s=>k.includes(s)).length;
  const total=list.length,ont=cnt(['ontime']),over=cnt(['overdue']),work=cnt(['active','today']);
  const urgent=list.filter(t=>t.status!=='done'&&diff(t.due,today())>=0&&diff(t.due,today())<=3).length;
  const idx=score(list),[lv,lc]=level(idx);
  let h='<div class="pt"><h2>Аналитика</h2>'+periodSel()+'</div>';
  h+='<div class="grid"><div class="kpi"><b>'+total+'</b><span>всего поручений</span></div>'+
   '<div class="kpi"><b>'+(total?Math.round(ont/total*100)+'%':'—')+'</b><span>выполнено в срок</span></div>'+
   '<div class="kpi"><b style="color:var(--bad)">'+over+'</b><span>просрочено</span></div>'+
   '<div class="kpi"><b>'+work+'</b><span>в работе (срочных: '+urgent+')</span></div>'+
   '<div class="kpi"><b>'+pc(idx)+'</b><span>индекс дисциплины · <span class="tag '+lc+'">'+lv+'</span></span></div></div>';
  h+='<div class="card" style="margin-top:12px"><h3>По важности</h3><div class="leg"><span><b class="c-ok"></b>в срок</span><span><b class="c-late"></b>с опозданием</span><span><b class="c-bad"></b>просрочено</span><span><b class="c-act"></b>в работе</span></div>'+
   Object.keys(PRN).map(k=>{const l=list.filter(t=>t.priority===k);return'<div class="brow"><div class="top"><span>'+PRN[k]+'</span><b>'+l.length+'</b></div>'+segBar(l)+'</div>'}).join('')+'</div>';
  if(isMgr())h+='<div class="card"><h3>По исполнителям</h3>'+db.staff.map(s=>{const l=list.filter(t=>t.assignee===s.id);return l.length?'<div class="brow"><div class="top"><span>'+esc(s.name)+'</span><b>'+pc(score(l))+'</b></div>'+segBar(l)+'</div>':''}).join('')||'<div class="empty">Нет данных</div>';
  if(isMgr())h+='</div>';
  // динамика
  const T=today(),months=[];const d0=new Date();
  for(let i=5;i>=0;i--){const d=new Date(d0.getFullYear(),d0.getMonth()-i,1);months.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
  const ml=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  h+='<div class="card"><h3>Динамика индекса за 6 месяцев</h3><div class="trend">'+months.map(m=>{
    const l=all.filter(t=>{const s=tstate(t);const ref=(s==='ontime'||s==='late')?t.doneAt:s==='overdue'?t.due:null;return ref&&ref.slice(0,7)===m});
    const p=score(l);
    return'<div class="col"><span>'+pc(p)+'</span><div class="bar" style="height:'+(p==null?0:Math.max(p*100,3))+'%"></div><span>'+ml[+m.slice(5)-1]+'</span></div>'}).join('')+'</div></div>';
  const up=sortTasks(all.filter(t=>t.status!=='done')).slice(0,8);
  h+='<div class="card"><h3 style="margin-bottom:6px">Ближайшие сроки</h3>'+(up.length?up.map(t=>{const[l,c]=dueLabel(t);return'<div class="alert"><div style="flex:1"><b>'+esc(t.title)+'</b><div class="small muted">'+esc(staffBy(t.assignee)?.name||'')+' · '+fmt(t.due)+'</div></div><span class="tag '+c+'">'+esc(l)+'</span></div>'}).join(''):'<div class="empty">Активных поручений нет</div>')+'</div>';
  return h;
}

function ratingView(){

    return{s,idx:score(l),on:c(['ontime']),late:c(['late']),over:c(['overdue']),work:c(['active','today'])}});
  const ranked=rows.filter(r=>r.idx!=null).sort((a,b)=>b.idx-a.idx||b.on-a.on);

  }
  const full=ranked.concat(rows.filter(r=>r.idx==null));
  h+='<div class="card tw"><table><thead><tr><th>#</th><th>Сотрудник</th><th>Индекс</th><th>В срок</th><th>С опоз.</th><th>Просроч.</th><th>В работе</th><th>Уровень</th></tr></thead><tbody>'+
   full.map(r=>{const i=ranked.indexOf(r),[lv,lc]=level(r.idx);return'<tr><td>'+(i<0?'—':i+1)+'</td><td><b>'+esc(r.s.name)+'</b><div class="small muted">'+esc(r.s.pos||'')+'</div></td><td><b>'+pc(r.idx)+'</b></td><td>'+r.on+'</td><td>'+r.late+'</td><td>'+r.over+'</td><td>'+r.work+'</td><td><span class="tag '+lc+'">'+lv+'</span></td></tr>'}).join('')+'</tbody></table></div>';
  return h;
}

const forms={
  newcard(fd){
    if(db.staff.length>=MAXSTAFF)return toast('Достигнут лимит: '+MAXSTAFF+' сотрудников','bad');
    const first=!db.staff.length;
    const s={id:uid(),name:fd.get('name').trim(),pos:fd.get('pos').trim(),role:first?'head':'staff',phone:'',ext:'',email:'',uid:null};
    if(!s.name)return;db.staff.push(s);save();login(s.id);if(first)toast('Вы — руководитель подразделения','ok');
  },
  code(fd,f){if(fd.get('code')!==db.config.joinCode)return toast('Неверный код','bad');login(f.dataset.id)},
  task(fd,f){
    const title=fd.get('title').trim(),due=fd.get('due');if(!title||!due)return;
    const stepsT=fd.get('steps').split('\n').map(x=>x.trim()).filter(Boolean);
    const base={title,desc:fd.get('desc').trim(),src:fd.get('src').trim(),priority:fd.get('priority'),due};
    if(f.dataset.id){
      const t=db.tasks.find(x=>x.id===f.dataset.id);if(!t)return;
      const old=t.steps||[];Object.assign(t,base,{assignee:fd.get('assignee'),steps:stepsT.map(x=>({t:x,d:!!old.find(o=>o.t===x&&o.d)}))});
    }else{
      const as=fd.getAll('assignee');if(!as.length)return toast('Выберите хотя бы одного исполнителя','warn');
      as.forEach(a=>db.tasks.push(Object.assign({id:uid(),assignee:a,status:'new',created:today(),doneAt:null,by:me,steps:stepsT.map(x=>({t:x,d:false})),nudge:null},base)));
      if(as.length>1)toast('Создано поручений: '+as.length,'ok');
    }
    save();closeDlg();R();
  },
  staff(fd,f){
    const v={name:fd.get('name').trim(),pos:fd.get('pos').trim(),phone:fd.get('phone').trim(),ext:fd.get('ext').trim(),email:fd.get('email').trim()};
    if(!v.name)return;
    if(f.dataset.id){
      const s=staffBy(f.dataset.id);if(!s)return;
      if(isHead()&&fd.get('role')){
        const nr=fd.get('role');
        if(s.role==='head'&&nr!=='head'&&db.staff.filter(x=>x.role==='head').length===1)return toast('Должен остаться хотя бы один руководитель','bad');
        s.role=nr;
      }
      Object.assign(s,v);
    }else{
      if(db.staff.length>=MAXSTAFF)return toast('Достигнут лимит: '+MAXSTAFF+' сотрудников','bad');
      db.staff.push(Object.assign({id:uid(),role:fd.get('role')||'staff',uid:null},v));
    }
    save();closeDlg();R();
  },
  config(fd){
    db.config.unit=fd.get('unit').trim()||'Структурное подразделение';
    db.config.remind=fd.getAll('rem').map(Number).sort((a,b)=>b-a);
    db.config.joinCode=fd.get('code');save();R();toast('Настройки сохранены','ok');
  },
  cl(fd,f){const t=fd.get('t').trim();if(!t)return;(db.checklists[me]=db.checklists[me]||[]).push({id:uid(),t,d:false});save();R();$('input[name=t]')?.focus()}
};

function csvDownload(name,rows){
  const c=v=>{v=String(v??'');return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  dl(name,'﻿'+rows.map(r=>r.map(c).join(';')).join('\r\n'),'text/csv;charset=utf-8');
}
function dl(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
const b64=u=>{let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pw,salt,iter,use){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,[use]);
}
async function encrypt(text,pw){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(pw,salt,150000,'encrypt');
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(text)));
  return JSON.stringify({enc:'AES-256-GCM',kdf:'PBKDF2-SHA-256',iter:150000,salt:b64(salt),iv:b64(iv),data:b64(ct)});
}
async function decrypt(obj,pw){
  const key=await deriveKey(pw,unb64(obj.salt),obj.iter||150000,'decrypt');
  return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(obj.iv)},key,unb64(obj.data)));
}

  const tasks=db.tasks.map(t=>({id:t.id,title:noText?'':t.title,desc:noText?'':t.desc,src:noText?'':t.src,priority:t.priority,due:t.due,assignee:t.assignee,status:t.status,created:t.created,doneAt:t.doneAt,by:t.by,steps:noText?[]:(t.steps||[]).map(s=>({t:s.t,d:s.d}))}));

      else csvDownload('sotrudniki-'+stamp+'.csv',[['ФИО','Должность','Роль','Телефон','Внутр.','E-mail']].concat(staff.map(s=>[s.name,s.pos,RLN[s.role],s.phone,s.ext,s.email])));
    }else{

      if(pw){if(!crypto?.subtle)throw new Error('Шифрование недоступно в этом режиме браузера');txt=await encrypt(txt,pw);name='export-'+stamp+'.enc.json'}

async function checkImport(){
  const R_=$('#iR');impData=null;
  try{
    let txt=$('#iT').value.trim();if(!txt)throw new Error('Нет данных для импорта');
    let o=JSON.parse(txt);
    if(o.enc){const pw=$('#iP').value;if(!pw)throw new Error('Файл зашифрован — введите пароль');
      try{o=JSON.parse(await decrypt(o,pw))}catch(e){throw new Error('Неверный пароль или файл повреждён')}}
    if(o.app!=='ispdisc'||!Array.isArray(o.staff)||!Array.isArray(o.tasks))throw new Error('Неизвестный формат файла');
    const staff=o.staff.filter(s=>s&&typeof s.name==='string'&&s.name.trim()).map(s=>({id:String(s.id||uid()),name:s.name.trim().slice(0,100),pos:String(s.pos||'').slice(0,100),role:RLN[s.role]?s.role:'staff',phone:String(s.phone||'').slice(0,40),ext:String(s.ext||'').slice(0,10),email:String(s.email||'').slice(0,100)}));
    const dateOk=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v);
    const tasks=o.tasks.filter(t=>t&&dateOk(t.due)&&t.assignee).map(t=>({id:String(t.id||uid()),title:String(t.title||'').slice(0,200)||'(без названия)',desc:String(t.desc||'').slice(0,5000),src:String(t.src||'').slice(0,200),priority:W[t.priority]?t.priority:'mid',due:t.due,assignee:String(t.assignee),status:STN[t.status]?t.status:'new',created:dateOk(t.created)?t.created:today(),doneAt:dateOk(t.doneAt)?t.doneAt:null,by:t.by?String(t.by):null,steps:Array.isArray(t.steps)?t.steps.slice(0,50).map(s=>({t:String(s.t||'').slice(0,200),d:!!s.d})):[]}));
    impData={staff,tasks,anon:!!o.anon};
    R_.innerHTML='<div class="card" style="margin:0 0 10px"><b>Файл проверен.</b><br>Сотрудников: '+staff.length+' · Поручений: '+tasks.length+(o.anon?'<br><span class="tag warn">обезличено</span> записи будут добавлены как новые':'')+'</div>'+
      '<label class="opt"><input type="radio" name="iM" value="merge" checked><span><b>Добавить / обновить</b><br><span class="small muted">существующие записи обновляются по id, остальные добавляются</span></span></label>'+
      '<label class="opt"><input type="radio" name="iM" value="replace"><span><b>Заменить все данные</b><br><span class="small muted">текущие сотрудники и поручения будут удалены</span></span></label>'+
      '<div class="df"><button class="btn pri" data-act="doImport">Импортировать</button></div>';
  }catch(err){R_.innerHTML='<div class="tag bad" style="white-space:normal;padding:8px 12px">'+esc(err.message)+'</div>'}
}
function doImport(){
  if(!impData)return;
  const mode=document.querySelector('input[name=iM]:checked').value,{staff,tasks,anon}=impData;
  const map={},next=mode==='replace'?[]:db.staff.map(s=>Object.assign({},s));
  let nt=mode==='replace'?[]:db.tasks.map(t=>Object.assign({},t));
  if(mode==='replace'&&staff.length&&!staff.some(s=>s.role==='head'))return toast('В файле нет руководителя — замена невозможна','bad');
  if(mode==='replace'&&!confirm('Все текущие данные будут заменены. Продолжить?'))return;
  for(const s of staff){
    const ex=!anon&&mode==='merge'?next.find(x=>x.id===s.id):null;
    if(ex){Object.assign(ex,{name:s.name,pos:s.pos,phone:s.phone,ext:s.ext,email:s.email});map[s.id]=ex.id;continue}
    if(next.length>=MAXSTAFF)return toast('Превышен лимит '+MAXSTAFF+' сотрудников — импорт отменён','bad');
    const id=(mode==='replace'&&!anon)?s.id:(next.some(x=>x.id===s.id)?uid():s.id);
    next.push(Object.assign({},s,{id,uid:null}));map[s.id]=id;
  }
  const ids=new Set(next.map(s=>s.id));
  let skipped=0;
  for(const t of tasks){
    const a=map[t.assignee]||(ids.has(t.assignee)&&!staff.length?t.assignee:null);
    if(!a){skipped++;continue}
    const by=map[t.by]||(ids.has(t.by)?t.by:null);
    const rec=Object.assign({},t,{assignee:a,by,nudge:null});
    const ex=!anon&&mode==='merge'?nt.find(x=>x.id===t.id):null;
    if(ex)Object.assign(ex,rec,{nudge:ex.nudge});else{if(nt.some(x=>x.id===rec.id))rec.id=uid();nt.push(rec)}
  }
  db.staff=next;db.tasks=nt;
  if(mode==='replace')db.checklists={};
  save();closeDlg();
  toast('Импорт завершён: сотрудников '+staff.length+', поручений '+(tasks.length-skipped)+(skipped?' (пропущено '+skipped+')':''),'ok');
  if(!meS()){acts.logout()}else R();
}
